<!DOCTYPE html>
<html>
<head>
<title>Payment</title>
<style>
body{
  font-family:Arial;
  background:linear-gradient(to right,#1e3c72,#2a5298);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box{
  background:white;
  padding:30px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.3);
  text-align:center;
  width:320px;
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
}

button{
  background:#27ae60;
  color:white;
  padding:10px 20px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="box">
<h2>💳 Payment</h2>

<p id="amount"></p>

<input placeholder="Card Number">
<input placeholder="Name on Card">
<input placeholder="CVV">

<button onclick="pay()">Pay Now</button>
<button onclick="window.location='index.html'">🏠 Home</button>
</div>

<script>
let price = localStorage.getItem("price") || 500;
document.getElementById("amount").innerText =
"Total Amount: ₹" + price;

function pay(){
  alert("Payment Successful 🎉");
  window.location="mytickets.html";
}
</script>

</body>
</html>
