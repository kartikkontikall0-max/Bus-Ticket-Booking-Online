<!DOCTYPE html>
<html>
<head>
<title>Book Ticket</title>
<style>
body{
  font-family: Arial;
  background: linear-gradient(to right,#36d1dc,#5b86e5);
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
.box{
  background:white;
  padding:30px;
  border-radius:10px;
  box-shadow:0 0 10px gray;
  text-align:center;
}
input{
  width:220px;
  padding:10px;
  margin:8px;
}
button{
  padding:10px 20px;
  background:green;
  color:white;
  border:none;
}
</style>
</head>

<body>

<div class="box">
<h2>Book Ticket 🎟️</h2>

<input id="user_id" placeholder="User ID"><br>
<input id="bus_id" placeholder="Bus ID"><br>
<input id="seat" placeholder="Seat Number"><br>
<input id="date" placeholder="Date (25-02-2026)"><br>

<button onclick="book()">Book Now</button>
<button onclick="window.location='index.html'">🏠 Home</button>
</div>

<script>
function book(){
  fetch("http://localhost:3000/bookticket", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      user_id: document.getElementById("user_id").value,
      bus_id: document.getElementById("bus_id").value,
      seat_no: document.getElementById("seat").value,
      date: document.getElementById("date").value
    })
  })
  .then(res=>res.text())
  .then(data=>alert(data));
}
</script>

</body>
</html>
